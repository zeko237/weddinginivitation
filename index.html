<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation | Yossif & Nada</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&family=Alex+Brush&display=swap" rel="stylesheet">

<style>

:root{

--gold:#c89b2d;

--gold2:#e9c55b;

--bg:#fdfbf7;

--text:#2b241a;

}

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:'Cairo',sans-serif;

background:var(--bg);

overflow:hidden;

color:var(--text);

}

.page-one{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

background:radial-gradient(circle,#fff,#f8f3ea);

z-index:999;

cursor:pointer;

transition:1s;

}

.page-one.slide{

transform:translateY(-100%);

}

.welcome{

font-size:70px;

font-family:'Alex Brush',cursive;

background:linear-gradient(45deg,#9c7415,#e9c55b,#9c7415);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

margin-bottom:10px;

}

.subtitle{

letter-spacing:4px;

font-size:24px;

margin-bottom:20px;

}

.couple{

font-family:'Alex Brush',cursive;

font-size:58px;

background:linear-gradient(45deg,#9c7415,#e9c55b,#9c7415);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

margin-bottom:50px;

}

.tap{

opacity:.6;

animation:pulse 1.5s infinite;

}

@keyframes pulse{

50%{

opacity:1;

}

}

.page-two{

min-height:100vh;

padding:40px 20px 80px;

display:flex;

flex-direction:column;

align-items:center;

background:#fff;

}

.photo{

width:190px;

height:190px;

border-radius:50%;

overflow:hidden;

border:5px solid var(--gold);

box-shadow:0 10px 30px rgba(0,0,0,.15);

margin-bottom:30px;

}

.photo img{

width:100%;

height:100%;

object-fit:cover;

}
.details{

width:100%;

max-width:360px;

display:flex;

flex-direction:column;

gap:15px;

margin-top:10px;

}

.card{

background:#fff;

padding:18px;

border-radius:15px;

border:1px solid rgba(200,155,45,.35);

box-shadow:0 8px 20px rgba(0,0,0,.05);

text-align:center;

font-size:22px;

}

.location-btn{

display:inline-flex;

align-items:center;

justify-content:center;

margin-top:30px;

padding:15px 40px;

border-radius:40px;

background:linear-gradient(45deg,#b98d22,#e9c55b,#b98d22);

color:#fff;

font-size:22px;

font-weight:bold;

text-decoration:none;

box-shadow:0 8px 20px rgba(0,0,0,.15);

transition:.3s;

}

.location-btn:hover{

transform:scale(1.05);

}

.countdown{

display:flex;

gap:15px;

margin-top:45px;

flex-wrap:wrap;

justify-content:center;

}

.box{

width:75px;

height:75px;

border-radius:15px;

background:#fff;

border:2px solid var(--gold);

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

.box span:first-child{

font-size:30px;

font-weight:bold;

color:var(--gold);

}

.box span:last-child{

font-size:14px;

color:#666;

}

.petals{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

pointer-events:none;

overflow:hidden;

z-index:1;

}

.petal{

position:absolute;

width:12px;

height:12px;

background:#ffdce5;

border-radius:50% 0 50% 50%;

opacity:.8;

animation:fall linear forwards;

}

@keyframes fall{

0%{

transform:translateY(-20px) rotate(0deg);

}

100%{

transform:translateY(110vh) rotate(360deg);

}

}

@media(max-width:768px){

.welcome{

font-size:56px;

}

.couple{

font-size:44px;

}

.photo{

width:180px;

height:180px;

}

.card{

font-size:18px;

}

}

</style>

</head>

<script>
    function openInvitation(){

document.querySelector(".page-one").classList.add("slide");

document.body.style.overflow="auto";

}

const weddingDate=new Date("August 21, 2026 20:00:00").getTime();

function updateCountdown(){

const now=new Date().getTime();

const distance=weddingDate-now;

if(distance<=0){

document.getElementById("days").innerHTML="00";

document.getElementById("hours").innerHTML="00";

document.getElementById("minutes").innerHTML="00";

document.getElementById("seconds").innerHTML="00";

return;

}

const days=Math.floor(distance/(1000*60*60*24));

const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

const minutes=Math.floor((distance%(1000*60*60))/(1000*60));

const seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML=String(days).padStart(2,"0");

document.getElementById("hours").innerHTML=String(hours).padStart(2,"0");

document.getElementById("minutes").innerHTML=String(minutes).padStart(2,"0");

document.getElementById("seconds").innerHTML=String(seconds).padStart(2,"0");

}

updateCountdown();

setInterval(updateCountdown,1000);

const petals=document.getElementById("petals");

setInterval(()=>{

const petal=document.createElement("div");

petal.className="petal";

const size=Math.random()*10+8;

petal.style.width=size+"px";

petal.style.height=size+"px";

petal.style.left=Math.random()*100+"vw";

petal.style.animationDuration=(Math.random()*4+5)+"s";

petals.appendChild(petal);

setTimeout(()=>{

petal.remove();

},9000);

},250);

</script>
